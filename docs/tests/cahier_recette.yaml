  - id: NT-143
    name: Duplication de sessions détaillées et libres
    objectif: Créer une session indépendante depuis un détail sans effet avant validation.
    steps:
      - Ouvrir une session détaillée réalisée avec exercices, séries, synthèse, analyse et photo, puis choisir Dupliquer la session
      - Vérifier le préremplissage et la date vide, modifier une série et un exercice, choisir une nouvelle date puis enregistrer
