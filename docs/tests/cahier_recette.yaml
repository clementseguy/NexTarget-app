    steps:
      - Dans Sessions, ouvrir Autres créations et choisir Session libre
      - Vérifier aussi les actions Session planifiée et Session réalisée détaillée
      - Créer une session libre avec date, arme, calibre libre, nombre de tirs, distance entière et chacune des trois catégories lors de trois essais
      - Associer zéro, un puis plusieurs exercices ; ajouter, consulter, remplacer puis supprimer une photo ; renseigner une synthèse
      - Ouvrir la carte Libre, modifier la session puis la supprimer
      - Vérifier l'aide contextuelle Sessions et les thèmes Classique et France
      - Contrôler statistiques, objectifs d'assiduité, filtres catégorie/exercice et compteur de tirs de l'arme
      - Exporter puis réimporter une sauvegarde contenant sessions détaillées et libres
      - Modifier une session détaillée historique à distance décimale sans toucher la distance, puis essayer une nouvelle distance décimale
    expected:
      - Les trois créations secondaires sont distinctes par icône, libellé et sémantique accessibles
      - La session libre est toujours réalisée et refuse arme/calibre vides, tirs nuls, distance nulle ou décimale
      - Carte et détail affichent Libre, arme, calibre, catégorie, tirs, distance et exercices sans score, groupement, séries ni action Coach
      - Synthèse, photo et exercices sont conservés ; l'import/export préserve chaque sous-type et ses champs
      - Les agrégats d'assiduité et volumes incluent la session libre, contrairement aux métriques de séries ; un calibre inconnu est absent de la seule répartition par calibre
      - La distance décimale historique reste affichée sans arrondi ni réécriture et doit être corrigée vers un entier avant enregistrement

