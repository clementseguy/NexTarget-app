  - id: NT-025
    name: Difficulté facultative des exercices
    objectif: Vérifier création, édition, filtres, duplication et sauvegarde rétrocompatibles.
    steps:
      - Créer successivement un exercice sans difficulté puis un exercice de chaque niveau
      - Vérifier sur largeur mobile que Catégorie et Type partagent une ligne et que la difficulté utilise quatre segments
      - Modifier puis effacer la difficulté d'un exercice
      - Combiner chaque filtre de difficulté avec catégorie, type et tri
      - Dupliquer un exercice Expert, modifier la copie et contrôler la source
      - Exporter puis importer les exercices avec et sans difficulté
      - Importer une sauvegarde historique sans difficulté puis une valeur inconnue
    expected:
      - Le sélecteur affiche Débutant, Avancé, Expert et N/A ; les valeurs historiques restent affichées Non renseignée dans les cartes et filtres
      - Les détails et badges des cartes restent lisibles dans les thèmes Classique et France
      - Les textes barrés des objectifs atteints et l'aide de priorité restent lisibles dans les thèmes Classique et France
      - Aucun niveau n'est déduit automatiquement et les filtres se combinent correctement
      - La copie reprend la valeur sans partager d'état mutable avec la source
      - Le cycle courant conserve la difficulté et les données historiques restent valides

  - id: NT-144
    name: Cohérence de la documentation du backlog
    objectif: Vérifier la séparation entre inventaire, descriptions, priorités, journal et archive.
    steps:
      - Vérifier que chaque item actif du backlog possède une description et au plus une priorité
      - Vérifier que le statut des items actifs n'apparaît que dans backlog-unifie.md
      - Vérifier les liens, les ancres, le prochain ID et l'archive annuelle
      - Vérifier que le journal reste chronologique, concis et sans statut courant concurrent
    expected:
