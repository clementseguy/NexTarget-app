  - id: NT-131
    name: Session guidée au stand et brouillon reprenable
    objectif: Préparer, interrompre, reprendre puis clôturer une séance détaillée sans session prévue ni exercice obligatoire.
    preconditions:
      - Disposer éventuellement d'un calibre et d'une prise par défaut, d'armes au râtelier et de plusieurs exercices
    steps:
      - Ouvrir Sessions et vérifier l'action principale Au stand ainsi que les trois créations du menu Autres créations
      - Préparer 10 séries de 7 coups avec une arme libre suggérée par le râtelier, un calibre libre, zéro puis plusieurs exercices, une distance initiale et une prise
      - Vérifier l'alignement arme/calibre puis séries/coups/distance et la position des raccourcis 15 m et 25 m sous la distance
      - Commencer, renseigner une série avec un score nul et un commentaire vide, puis vérifier la sauvegarde temporisée
      - Sur une autre série, saisir un commentaire sans score, quitter puis reprendre et vérifier que le score reste vide et obligatoire
      - Utiliser les raccourcis 15 m et 25 m, une distance libre, modifier la prise, naviguer vers la série précédente puis la suivante
      - Ajouter une série, quitter temporairement l'assistant, fermer puis redémarrer l'application
      - Vérifier que l'action principale reste Au stand et reprendre depuis la carte Séance en cours de l'historique
      - Terminer plus tôt, vérifier le nombre de séries vides retirées, puis annuler et recommencer la confirmation
      - Dans le récapitulatif, vérifier matériel, exercices, séries, coups, distances et points ; ajouter, remplacer puis retirer une photo et saisir une synthèse
      - Vérifier qu'une seconde création guidée est refusée tant que le brouillon existe
      - Terminer la séance, créer un nouveau brouillon puis l'abandonner après confirmation
      - Créer un autre brouillon, puis exporter et réimporter la sauvegarde
      - Pendant une clôture, vérifier que l'ajout, les actions et la sortie sont désactivés ; tenter aussi de réimporter un brouillon lorsqu'un autre existe
    expected:
      - La préparation propose date et heure courantes, les préférences sans autoremplacement, 10 séries de 5 coups par défaut et un volume calculé sans borne maximale à cinq
      - L'exercice reste facultatif et ne modifie jamais le nombre de séries ; distance et prise sont héritées comme simples préremplissages indépendants
      - Le brouillon et la saisie partielle survivent à l'interruption, apparaissent séparément en tête des Réalisées et restent absents des statistiques, objectifs, compteurs et analyses Coach
      - La fin anticipée ne conserve aucune série vide et l'abandon supprime le brouillon et sa photo uniquement après confirmation
      - Après abandon, aucun brouillon ne réapparaît, même brièvement, au retour dans Sessions
      - La clôture ouvre directement le détail d'une session détaillée réalisée standard sans réafficher temporairement le brouillon ; une erreur simulée conserve intégralement le brouillon avec un message exploitable
      - Un score absent ne devient jamais zéro après reprise ; aucune mutation ne peut suivre la clôture et un import ne peut jamais créer un second brouillon
      - Les sessions planifiées, réalisées détaillées, libres et le wizard de conversion prévue restent fonctionnels dans les thèmes Classique et France
      - Les filtres exercice et catégorie restent alignés dans les onglets Réalisées et Prévues ; les prévues datées sont classées par date croissante avant celles affichées Sans date

